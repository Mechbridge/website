# nginx site for mechbridgegroup.com (website). Install to /etc/nginx/sites-available/mechbridge
# Certificates come from: sudo certbot certonly --nginx -d mechbridgegroup.com -d www.mechbridgegroup.com -d mail.mechbridgegroup.com
# (one certificate for all three names, also used by Postfix and Dovecot).

server {
  listen 80;
  listen [::]:80;
  server_name mechbridgegroup.com www.mechbridgegroup.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://mechbridgegroup.com$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.mechbridgegroup.com;
  ssl_certificate     /etc/letsencrypt/live/mechbridgegroup.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mechbridgegroup.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  return 301 https://mechbridgegroup.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name mechbridgegroup.com;
  ssl_certificate     /etc/letsencrypt/live/mechbridgegroup.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mechbridgegroup.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  client_max_body_size 6m;   # CV uploads are capped at 5 MB by the app

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

  # Hashed build assets: cache for a year.
  location /_astro/ {
    proxy_pass http://127.0.0.1:4321;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }
  # Photos, share cards and the clay scene scripts: cache for a week.
  location ~ ^/(images|og|bg|logo|brand)/ {
    proxy_pass http://127.0.0.1:4321;
    expires 7d;
  }

  location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

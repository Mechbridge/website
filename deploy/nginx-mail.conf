# nginx site for Roundcube webmail at mail.mechbridgegroup.com. Install to /etc/nginx/sites-available/mail
# Replace PHP_SOCK below with your PHP-FPM socket (ls /run/php/  →  e.g. /run/php/php8.4-fpm.sock).

server {
  listen 80;
  listen [::]:80;
  server_name mail.mechbridgegroup.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://mail.mechbridgegroup.com$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name mail.mechbridgegroup.com;
  ssl_certificate     /etc/letsencrypt/live/mechbridgegroup.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mechbridgegroup.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  root /var/lib/roundcube/public_html;
  index index.php;
  client_max_body_size 25m;   # attachments

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location / { try_files $uri $uri/ /index.php?$args; }

  # Never serve Roundcube internals.
  location ~ ^/(config|temp|logs|bin|SQL|installer)/ { deny all; }
  location ~ /\. { deny all; }

  location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:PHP_SOCK;
  }
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MechBridge clay background demo</title>
<style>
  body { margin: 0; }
  /* The background layer: tall wrapper + sticky full-viewport canvas. */
  .mb-bg { --ground: #1A2841; position: relative; width: 100%; height: 7600px; background: var(--ground); }
  .mb-bg canvas { position: sticky; top: 0; display: block; width: 100%; height: 100vh; }
</style>
</head>
<body>
<div class="mb-bg" id="mb-bg"><canvas id="mb-stage" aria-hidden="true"></canvas></div>
<script src="vendor/three.min.js"></script>
<script src="mb-clay-background.js"></script>
<script>
  MechBridgeBackground.mount(
    document.getElementById('mb-bg'),
    document.getElementById('mb-stage'),
    { motion: 'Scroll', stopMotion: false, colorShift: true }
  );
</script>
</body>
</html>
